<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Grafik · RIZZTRADE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="theme.js"></script>
<style>html,body{height:100%}body{display:flex;flex-direction:column;padding:0;overflow:hidden}.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--cd)}canvas{flex:1;height:auto;min-height:0;width:100%}#ob{padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:13px;color:var(--mu);border-top:1px solid var(--bd);background:var(--cd)}</style></head>
<body><div class="fb"><a class="chip" href="index.html">← Kembali</a><b>XAUUSD</b><b id="pr" style="color:var(--ac)"></b><span class="tag" id="lv"></span><div class="tf" id="tf"><button class="chip" data-n="M15">M15</button><button class="chip" data-n="H1">H1</button><button class="chip" data-n="H4">H4</button><button class="chip" data-n="D1">D1</button></div><button class="chip on" id="ma">Rata-rata</button><button class="chip on" id="lvl">Level</button><span style="flex:1"></span><button class="chip" id="th">◐ Tema</button><button class="chip" id="fs">⛶ Layar penuh</button></div>
<canvas id="cv" aria-label="Grafik candlestick XAUUSD layar penuh"></canvas><div id="ob"></div><script>const $=i=>document.getElementById(i),cv=$("cv"),cx=cv.getContext("2d"),f=(n,d=2)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}),V=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const TF={M15:[3,11],H1:[7,31],H4:[13,64],D1:[21,125]};let ALL=[4315,4205,4065,3970];try{const l=JSON.parse(localStorage.getItem("rz_set")||"{}").lv;if(Array.isArray(l)&&l.length)ALL=l}catch(e){}
let MA=true,LV=ALL.slice(),D=[],hi=-1,live=false,cur=new URLSearchParams(location.search).get("tf");if(!TF[cur])cur="H1";
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function demo(n){const [s,v]=TF[n],r=rng(s*977),a=[];let p=4178-(r()-.4)*60;for(let i=0;i<60;i++){const o=p,c=o+(r()-.5)*v*2.2;a.push({o,h:Math.max(o,c)+r()*v*.8,l:Math.min(o,c)-r()*v*.8,c});p=c}const k=4178-a[59].c;return a.map(x=>({o:x.o+k,h:x.h+k,l:x.l+k,c:x.c+k}))}
function sma(i,n=20){if(!MA||i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=D[k].c;return s/n}
function draw(){if(!D.length)return;const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,W,H);
  const up=V("--up"),dn=V("--dn"),ac=V("--ac"),gr=V("--gr"),lv=V("--lv"),mu=V("--mu");
  const pl=8,pr=62,pt=10,pb=22,w=W-pl-pr,h=H-pt-pb;let mx=Math.max(...D.map(x=>x.h)),mn=Math.min(...D.map(x=>x.l));const pad=(mx-mn)*.08;mx+=pad;mn-=pad;
  const Y=v=>pt+(mx-v)/(mx-mn)*h,st=w/D.length;cv._m={pl,st};cx.font="11px Plus Jakarta Sans,sans-serif";cx.textBaseline="middle";
  for(let i=0;i<=5;i++){const v=mn+(mx-mn)*i/5,y=Y(v);cx.strokeStyle=gr;cx.beginPath();cx.moveTo(pl,y);cx.lineTo(W-pr,y);cx.stroke();cx.fillStyle=mu;cx.fillText(f(v,0),W-pr+8,y)}
  LV.forEach(v=>{if(v>mn&&v<mx){const y=Y(v);cx.strokeStyle=lv;cx.setLineDash([6,5]);cx.beginPath();cx.moveTo(pl,y);cx.lineTo(W-pr,y);cx.stroke();cx.setLineDash([]);cx.fillStyle=mu;cx.fillText(v>D[D.length-1].c?"Resistance":"Support",pl+4,y-8)}});
  D.forEach((x,i)=>{const px=pl+st*(i+.5),u=x.c>=x.o,col=u?up:dn,bw=Math.max(2,st*.62);if(i===hi){cx.fillStyle=V("--hl");cx.fillRect(pl+st*i,pt,st,h)}
    cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(px,Y(x.h));cx.lineTo(px,Y(x.l));cx.stroke();const t=Y(Math.max(x.o,x.c)),b=Y(Math.min(x.o,x.c));cx.fillRect(px-bw/2,t,bw,Math.max(1.5,b-t))});
  cx.strokeStyle=ac;cx.lineWidth=1.8;cx.beginPath();let s=0;D.forEach((x,i)=>{const m=sma(i);if(m==null)return;const px=pl+st*(i+.5);s?cx.lineTo(px,Y(m)):cx.moveTo(px,Y(m));s=1});cx.stroke();
  const l=D[D.length-1],y=Y(l.c);cx.fillStyle=ac;cx.fillRect(W-pr+2,y-9,pr-4,18);cx.fillStyle=V("--on");cx.fillText(f(l.c),W-pr+6,y)}

function bar(i){const x=D[i];if(x)$("ob").textContent="Buka "+f(x.o)+"   Tinggi "+f(x.h)+"   Rendah "+f(x.l)+"   Tutup "+f(x.c)}
async function load(){try{const r=await fetch("/api/candles?tf="+cur),d=await r.json();if(!r.ok||!Array.isArray(d.candles))throw 0;D=d.candles;live=true}catch(e){D=demo(cur);live=false}
  $("lv").textContent=live?"Live":"Data contoh";$("pr").textContent=f(D[D.length-1].c);hi=-1;bar(D.length-1);draw()}
function ps(e){const r=cv.getBoundingClientRect(),m=cv._m,i=Math.floor((e.clientX-r.left-m.pl)/m.st);return i>=0&&i<D.length?i:-1}
cv.addEventListener("pointermove",e=>{const i=ps(e);if(i>=0&&i!==hi){hi=i;draw();bar(i)}});cv.addEventListener("pointerleave",()=>{hi=-1;draw();bar(D.length-1)});
document.querySelectorAll("#tf button").forEach(b=>{b.classList.toggle("on",b.dataset.n===cur);b.onclick=()=>{cur=b.dataset.n;document.querySelectorAll("#tf button").forEach(x=>x.classList.toggle("on",x===b));history.replaceState(null,"","?tf="+cur);load()}});
$("ma").onclick=e=>{MA=!MA;e.currentTarget.classList.toggle("on",MA);draw()};$("lvl").onclick=e=>{const o=!e.currentTarget.classList.contains("on");e.currentTarget.classList.toggle("on",o);LV=o?ALL.slice():[];draw()};
$("th").onclick=()=>RZ.cycle();$("fs").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
addEventListener("resize",draw);new MutationObserver(draw).observe(document.documentElement,{attributes:true});setInterval(()=>{if(live&&!document.hidden)load()},300000);load();</script></body></html>
